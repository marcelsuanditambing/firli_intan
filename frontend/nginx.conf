server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # Cache static assets aggressively
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Foto, lagu, favicon: browser selalu mengecek versi terbaru (balasan 304 bila
    # tidak berubah) agar foto yang diganti dengan nama sama langsung terlihat.
    location ~* \.(?:jpe?g|png|webp|gif|svg|mp3|ico)$ {
        add_header Cache-Control "no-cache";
        try_files $uri =404;
    }

    # SPA fallback: all unknown routes -> index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
